<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechVault - Device Registry</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>TechVault Inventory</h1>
      <p class="subtitle">Register new incoming gadgets, smartphones, or hardware components.</p>
      
      <form action="save.php" method="post" class="form-box">
        <div class="input-group">
          <input type="text" name="product" placeholder="Device Name (e.g., iPhone 15 Pro)" required>
        </div>
        <div class="input-group">
          <input type="date" name="date" required>
        </div>
        <div class="input-group">
          <input type="text" name="model" placeholder="Model Code / Serial (e.g., A3106)" required>
        </div>
        <div class="input-group">
          <input type="number" step="0.01" name="price" placeholder="Retail Price ($)" required>
        </div>
        <div class="input-group">
          <input type="text" name="category" placeholder="Device Type (e.g., Smartphones)" required>
        </div>
        <button type="submit" class="btn-submit">Register Device</button>
      </form>

      <div class="nav-link">
        <a href="view.php" class="link-secondary">⚡ Open Tech Catalog</a>
      </div>
    </div>
  </div>
</body>
</html>
